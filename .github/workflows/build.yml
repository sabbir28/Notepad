name: Build NotepadLite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Install toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-mingw-w64 \
            g++-mingw-w64 \
            binutils-mingw-w64 \
            jq \
            libgtk-3-dev \
            pkg-config

      - name: Build Linux binaries
        run: |
          set -euo pipefail
          mkdir -p build/logs
          make clean
          if ! make 2>&1 | tee build/logs/linux-build.log; then
            echo "LINUX_BUILD_FAILED=true" >> "$GITHUB_ENV"
          else
            cp build/bin/NotepadLite build/bin/NotepadLite-linux
          fi
          if ! make USE_GTK=0 2>&1 | tee build/logs/linux-console-build.log; then
            echo "LINUX_CONSOLE_BUILD_FAILED=true" >> "$GITHUB_ENV"
          else
            cp build/bin/NotepadLite build/bin/NotepadLite-linux-console
          fi

      - name: Build Windows binary
        run: |
          set -euo pipefail
          mkdir -p build/logs
          make clean
          echo "BUILD_FAILED=false" >> "$GITHUB_ENV"
          if ! make windows64 2>&1 | tee build/logs/build.log; then
            echo "BUILD_FAILED=true" >> "$GITHUB_ENV"
          fi

      - name: Upload build logs
        if: env.BUILD_FAILED == 'true' || env.LINUX_BUILD_FAILED == 'true' || env.LINUX_CONSOLE_BUILD_FAILED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NotepadLite-build-logs
          path: build/logs

      - name: Fail if build failed
        if: env.BUILD_FAILED == 'true' || env.LINUX_BUILD_FAILED == 'true' || env.LINUX_CONSOLE_BUILD_FAILED == 'true'
        run: |
          echo "Build failed. See uploaded logs."
          exit 1

      - name: Upload build artifact
        if: env.BUILD_FAILED != 'true' && hashFiles('build/bin/NotepadLite.exe') != ''
        uses: actions/upload-artifact@v4
        with:
          name: NotepadLite-build-windows
          path: build/bin/NotepadLite.exe
          if-no-files-found: ignore
      
      - name: Upload Linux artifacts
        if: env.LINUX_BUILD_FAILED != 'true' && env.LINUX_CONSOLE_BUILD_FAILED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NotepadLite-build-linux
          path: |
            build/bin/NotepadLite-linux
            build/bin/NotepadLite-linux-console
          if-no-files-found: warn

      - name: Fetch latest release metadata
        run: |
          set -euo pipefail
          DATA=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest)

          PUB_TIME=$(echo "$DATA" | jq -r '.published_at')
          if [ "$PUB_TIME" = "null" ]; then
            echo "LAST_RELEASE_EPOCH=0" >> "$GITHUB_ENV"
          else
            echo "LAST_RELEASE_EPOCH=$(date -d "$PUB_TIME" +%s)" >> "$GITHUB_ENV"
          fi

      - name: Gate release (10-minute cooldown)
        run: |
          set -euo pipefail
          NOW=$(date +%s)
          DIFF=$(( NOW - LAST_RELEASE_EPOCH ))
          THRESHOLD=$(( 10 * 60 ))

          if [ "$DIFF" -lt "$THRESHOLD" ]; then
            echo "blocked=true" >> "$GITHUB_ENV"
          else
            echo "blocked=false" >> "$GITHUB_ENV"
          fi

      - name: Compute version
        run: |
          set -euo pipefail
          VERSION="v$(date +'%y.%m').${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Create GitHub release
        if: env.blocked == 'false' && env.BUILD_FAILED != 'true' && env.LINUX_BUILD_FAILED != 'true' && env.LINUX_CONSOLE_BUILD_FAILED != 'true' && hashFiles('build/bin/NotepadLite.exe') != ''
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.VERSION }}
          name: NotepadLite Release ${{ env.VERSION }}
          artifacts: |
            build/bin/NotepadLite.exe
            build/bin/NotepadLite-linux
            build/bin/NotepadLite-linux-console
          bodyFile: release.txt
